name: Build & Release APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK / cmdline-tools
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Download Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Gradle --version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename APK
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Termidroid-${VER}.apk"
          ls -la release/

      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: Termidroid-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Termidroid ${{ github.ref_name }}
          files: release/Termidroid-${{ github.ref_name }}.apk
          body: |
            ## Termidroid ${{ github.ref_name }}

            **Download:** `Termidroid-${{ github.ref_name }}.apk` (attached below)

            ### How to install
            1. Download the APK on your Android phone/tablet
            2. Open the downloaded file
            3. If prompted, allow "Install from unknown sources" for your browser
            4. Tap Install, then Open

            ### Changes in v0.2.1
            - ✅ **Scrolling works!** You can now scroll up/down through terminal history.
              Auto-scroll resumes automatically when you scroll back to the bottom.
            - ✅ **Text selection:** long-press the output to select and copy text.
            - ✅ **Root / Shizuku detection:** Termidroid now detects if your device is
              rooted or if Shizuku is installed. Type `su` (or `sudo`) to enter a
              root shell when available.
            - ✅ **Fixed `toybox` spam:** the `help` command no longer accidentally runs
              toybox.
            - ✅ **License and docs** also copied into the `.github/` folder.

            ### Known limitations
            - The proot Linux userland (`gcc`, `python3`, `git`, `apt`, etc.) is the
              next major feature coming up. This release runs Android's built-in
              `/system/bin/sh` (Toybox).
            - VT100/ANSI color escape codes are still stripped — will be supported
              with the proper terminal view in a future release.
            - QEMU launcher, package manager screen, and extra QEMU home-screen icon
              are coming after the proot layer lands.

            ### About rooting
            Termidroid **cannot root your phone** by itself. A terminal app cannot do
            that — rooting requires unlocking the bootloader and flashing Magisk or
            similar from outside Android. If you are already rooted OR if you have
            Shizuku running, type `su` to get elevated privileges inside Termidroid.

            ### Automatic builds
            Every `v*` tag pushed to GitHub is automatically built and released by
            GitHub Actions. No PC required — just push code from your phone.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
