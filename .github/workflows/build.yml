name: Build & Release APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK / cmdline-tools
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Download Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Gradle --version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename APK
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Termidroid-${VER}.apk"
          ls -la release/

      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: Termidroid-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error

      - name: Build debug APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename APK
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Termidroid-${VER}.apk"
          ls -la release/

      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: Termidroid-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Termidroid ${{ github.ref_name }}
          files: release/Termidroid-${{ github.ref_name }}.apk
          body: |
            ## Termidroid ${{ github.ref_name }}

            **Download:** `Termidroid-${{ github.ref_name }}.apk`

            ### What's new in v0.3.0
            - **Real Linux shell via proot (no root required):** First launch
              downloads a static `proot` binary (~200 KB) and an Alpine Linux
              mini rootfs (~3 MB), then extracts and configures it. After that
              you're dropped into a real `/bin/sh` inside Alpine Linux.
            - **`tdpkg` — Termidroid's universal package manager:**
              `tdpkg install gcc`, `tdpkg install python3 git g++ make cmake
              nodejs qemu-system-x86_64`, etc. `tdpkg` auto-detects whether
              you're on Alpine (apk), Debian (apt), or Arch (pacman) and runs
              the correct install command.
            - **No fake button bar:** Tap anywhere on the terminal to bring up
              the keyboard — especially near the `$`/`#` prompt at the bottom.
              This feels like a real terminal, not a toy app.
            - **Long-press to select/copy text.**
            - **Scroll with your finger;** auto-scroll resumes when you reach
              the bottom.
            - **All docs/LICENSE live in `.github/`** in the repo.

            ### How to install
            1. Download the APK on your phone
            2. Open the downloaded file
            3. Allow "Install from unknown sources" for your browser if asked
            4. Install, then open

            ### On first launch
            You'll see a progress bar while proot and the Alpine rootfs
            download. This takes about 10-30 seconds on Wi-Fi. After that,
            every subsequent launch drops you straight into the shell.

            ### Things you can try after setup
            ```
            tdpkg install python3       # Python 3
            tdpkg install gcc g++ make  # C/C++ toolchain
            tdpkg install git           # Git
            tdpkg install cmake         # CMake
            tdpkg install nodejs        # Node.js
            tdpkg install qemu-system-x86_64   # QEMU x86_64 emulator
            tdpkg upgrade               # Upgrade all packages
            tdpkg search python         # Search for python packages
            ```

            ### Architecture
            Currently built for **arm64-v8a** (most modern Android phones).
            armeabi-v7a and x86_64 builds will be added in a later release.

            ### Honest status
            - ✅ Real Alpine Linux shell via proot on arm64 devices
            - ✅ tdpkg wrapper for apk/apt/pacman
            - ✅ Tap-to-type terminal UI, no fake key bar
            - 🚧 VT100 colors / full TTY support (coming)
            - 🚧 Package manager UI screen (just use `tdpkg` for now)
            - 🚧 Dedicated QEMU launcher icon (use `qemu-system-*` from shell)
            - 🚧 Shizuku / root shell bridging (coming next)

            Termidroid cannot root your phone by itself.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
