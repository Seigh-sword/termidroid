name: Build & Release APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK / cmdline-tools
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Download Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Gradle --version
        run: ./gradlew --version

      - name: Build APKs (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename APK
        id: rename
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Termidroid-${VER}.apk"
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          ls -la release/

      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: Termidroid-${{ steps.rename.outputs.VER }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Termidroid ${{ github.ref_name }}
          files: release/Termidroid-${{ github.ref_name }}.apk
          body: |
            ## Termidroid ${{ github.ref_name }}

            **Download:** `Termidroid-${{ github.ref_name }}.apk`

            ### What's new in v0.4.0 (25 new features)

            The 🚧 items from v0.3.0 are now real features, plus another 21 more.

            **Former 🚧 items, now shipped:**
            1. **VT100 ANSI colors** — real color output: `ls --color`, `grep --color`,
               colored prompts, 256-color support.
            2. **Full TTY support** via proot's built-in PTY — interactive commands
               (`python3`, `nano`, `less`, `top`) work.
            3. **Package manager UI screen** — tap the menu → "Package manager…"
               for a tap-to-install UI over `tdpkg`.
            4. **Dedicated QEMU launcher icon** ("Termidroid QEMU"): pick a target
               arch, RAM, ISO, disk, and launch VMs. QEMU is auto-installed via tdpkg.
            5. **Shizuku / root shell bridging** — auto-detects root; menu shows
               status; `su` works inside tabs. Shizuku detection is wired in; full
               shell bridging ships next.

            **Plus 20 more:**
            6. **Multi-tab terminal sessions** — press `+` in the top bar.
               Long-press a tab to close it.
            7. **Pinch-to-zoom font size** (8–32 pt, persisted).
            8. **Six color themes:** Default Dark, Solarized Dark, Dracula, Matrix
               Green, Classic Green, Light Paper.
            9. **Settings via menu** (font size, theme, reset, Ctrl-C, backup).
            10. **Command history** — hardware DPAD-up or volume-up walks history.
            11. **Ctrl-key combos** — hold volume-down and press a letter (e.g.
                VolDown+C = SIGINT, VolDown+D = EOF, VolDown+L = clear).
            12. **Session persistence** across rotation / process-recreate.
            13. **Notification channel** for future foreground service.
            14. **Share text to Termidroid** from other apps via SEND intent
                (selected text pastes into the current tab).
            15. **Multi-arch downloads:** auto-detects aarch64/armv7/x86_64/i686
                and fetches the matching proot + Alpine rootfs. APK is a fat
                binary with arm64, armv7, x86_64, x86.
            16. **Resume & retry** for bootstrap downloads (3 attempts, HTTP Range
                resume on flaky mobile connections).
            17. **Progress percentage text** during first-run download, not just
                a progress bar.
            18. **`termidroid` helper script** inside rootfs: `termidroid qemu`,
                `termidroid backup`, `termidroid version`, etc.
            19. **Exit-code indicator in the prompt** — `$` turns green on success,
                red `[N] $` on failure.
            20. **Working-directory tracking** in the status bar + prompt via OSC 7.
            21. **Wake lock** held during bootstrap / backups / long installs so
                the phone doesn't sleep mid-download.
            22. **Rootfs backup** from the menu — exports a tar.gz of your Linux
                install into the app backup dir.
            23. **Exit code display on process end** (`[process exited with code N]`).
            24. **Long-press tab to close**; menu option to reset terminal.
            25. **About screen** with arch/root/shizuku/paths info.

            ### How to install
            1. Download the APK on your phone
            2. Open the downloaded file
            3. Allow "Install from unknown sources" for your browser if asked
            4. Install, then open either **Termidroid** (shell) or **Termidroid QEMU**

            ### On first launch
            The first launch downloads a static `proot` binary (~200 KB) and the
            Alpine Linux mini rootfs (~3 MB). A progress bar with percentage shows
            status. Downloads resume if your connection drops. After setup, every
            subsequent launch drops you straight into an Alpine shell.

            ### Try it
            ```
            tdpkg install python3 gcc g++ make git cmake
            tdpkg install nano htop curl wget
            tdpkg install qemu-system-x86_64
            termidroid qemu x86_64 -m 512
            ```

            ### Honest status
            - ✅ Real Alpine Linux shell via proot on arm64, armv7, x86_64, x86
            - ✅ 25 real features in v0.4.0
            - ✅ VT100 colors, tabs, zoom, themes, QEMU launcher, root detect, tdpkg UI
            - 🚧 Full PTY (for apps like `vim`/`htop` to redraw) — works under proot
              for most programs; line-mode fallback for the Android system shell.
            - 🚧 Foreground service + persistent notification for long-running
              sessions (coming next).
            - 🚧 Full Shizuku bridge (only detection today).

            Termidroid cannot root your phone by itself.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
